name: VISTA-VLM CI

on:
  push:
    branches: [ main, master, v4-research-production-upgrade, v5-real-world-qualification, v6-research-reliability, v7-research-accuracy-reliability ]
  pull_request:
    branches: [ main, master, v4-research-production-upgrade, v5-real-world-qualification, v6-research-reliability, v7-research-accuracy-reliability ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install ruff
    - name: Run Ruff Lint Checks
      run: |
        python -m ruff check .

  frontend:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: "20"
        cache: 'npm'
        cache-dependency-path: studio/package-lock.json
    - name: Install Studio dependencies
      run: |
        cd studio
        npm ci
    - name: Build Studio React/TypeScript production bundle
      run: |
        cd studio
        npm run build

  test:
    needs: [lint]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install build tools and dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel build
        python -m pip install -r requirements.txt
        python -m pip install -e ".[dev]"

    - name: Verify package resolution
      run: |
        python -c "import vista_vlm; print('Installed vista_vlm from:', vista_vlm.__file__)"
        python -m pip show vista-vlm
        python -m pip check

    - name: Environment diagnostics
      run: |
        python scripts/validate_environment.py

    - name: Verify fixture script compilation
      run: |
        python -m py_compile scripts/prepare_benchmark_data.py

    - name: Generate procedural synthetic regression fixtures
      run: |
        python scripts/prepare_benchmark_data.py --output-root data/synthetic_fixtures

    - name: Validate synthetic fixture provenance and integrity
      run: |
        python -c "
        import json
        with open('data/manifests/synthetic/mvtec_manifest.json') as f:
            m = json.load(f)
        assert m['is_valid'] is True, f'MVTec manifest invalid: {m.get(\"integrity_errors\")}'
        assert m['provenance'] == 'procedural_synthetic_benchmark_fixture'
        print('MVTec synthetic fixture manifest certified:', m['total_samples'], 'samples')

        with open('data/manifests/synthetic/visa_manifest.json') as f:
            v = json.load(f)
        assert v['is_valid'] is True, f'VisA manifest invalid: {v.get(\"integrity_errors\")}'
        assert v['provenance'] == 'procedural_synthetic_benchmark_fixture'
        print('VisA synthetic fixture manifest certified:', v['total_samples'], 'samples')
        "

    - name: Run pytest test suite with coverage
      run: |
        mkdir -p reports
        python -m pytest tests/ -v --junitxml=reports/junit.xml --cov=vista_vlm --cov-report=xml:reports/coverage.xml --cov-report=term

    - name: Build distribution packages (wheel and sdist)
      run: |
        python -m build --no-isolation

    - name: Test clean wheel installation in isolated environment
      run: |
        python -m venv clean_env
        . clean_env/bin/activate
        python -m pip install --upgrade pip
        python -m pip install dist/vista_vlm-*.whl
        cd /tmp
        python -c "import vista_vlm; print('Clean wheel import succeeded:', vista_vlm.__file__, vista_vlm.__version__)"
        python -c "import vista_vlm.api, vista_vlm.calibration, vista_vlm.data, vista_vlm.models, vista_vlm.evaluation, vista_vlm.optimization, vista_vlm.utils; print('All subpackages imported successfully from wheel')"
        python -c "from vista_vlm.api.routes import router; print('FastAPI routes imported successfully from clean wheel')"

    - name: Upload test artifacts and reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports-python-${{ matrix.python-version }}
        path: |
          reports/junit.xml
          reports/coverage.xml
          data/manifests/synthetic/*.json

  docker:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build Docker container image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: vista-vlm:v7.0.0
